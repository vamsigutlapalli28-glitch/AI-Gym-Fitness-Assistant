<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AI Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">⚡ AI Gym</a>
    <div class="navbar-links">
        <a href="/register" class="btn btn-primary btn-sm">Register</a>
    </div>
</nav>

<div class="page-sm">
    <div class="card">
        <div class="card-header">Welcome Back</div>
        <h2 class="page-title" style="font-size:1.5rem; margin-bottom:4px;">Login</h2>
        <p class="page-sub">Sign in to your account to continue.</p>

        <form action="/login" method="POST">

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button class="btn btn-primary btn-block" type="submit">Login →</button>

        </form>

        <p style="text-align:center; margin-top:20px; font-size:0.85rem; color:var(--muted);">
            Don't have an account? <a href="/register" style="color:var(--accent); font-weight:600;">Register</a>
        </p>
    </div>
</div>

<footer>AI Gym Fitness Assistant © 2026</footer>

</body>
</html>
