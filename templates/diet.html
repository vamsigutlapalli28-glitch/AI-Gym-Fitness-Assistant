<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Recommendation — AI Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar">
    <a href="/dashboard" class="navbar-brand">⚡ AI Gym</a>
    <div class="navbar-links">
        <a href="/dashboard" class="btn btn-ghost btn-sm">← Dashboard</a>
    </div>
</nav>

<div class="page-sm">
    <div class="card">
        <div class="card-header">🥗 Nutrition</div>
        <h2 class="page-title" style="font-size:1.5rem; margin-bottom:4px;">Diet Recommendation</h2>
        <p class="page-sub">Select your BMI category to get a personalized plan.</p>

        <form action="/diet" method="POST">

            <div class="form-group">
                <label>Select Your BMI Category</label>
                <select name="category">
                    <option>Underweight</option>
                    <option>Normal</option>
                    <option>Overweight</option>
                    <option>Obese</option>
                </select>
            </div>

            <button class="btn btn-success btn-block" type="submit">Get Diet Plan →</button>

        </form>
    </div>
</div>

<footer>AI Gym Fitness Assistant © 2026</footer>

</body>
</html>
